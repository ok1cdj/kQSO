# XcodeGen spec for the iOS shell. The Xcode project is generated (CI: `xcodegen generate`
# in ios/) and not committed. The web build (web/dist) is copied to kQSO/web first and
# bundled as a folder; WebViewController serves it at kqso://app/.
name: kQSO
options:
  bundleIdPrefix: com.ok1cdj
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.8.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  kQSO:
    type: application
    platform: iOS
    sources:
      - path: kQSO
        excludes:
          - web
          - Info.plist
      - path: kQSO/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ok1cdj.kqso
        INFOPLIST_FILE: kQSO/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - kQSOUITests
  # App Store screenshots in the Simulator (.github/workflows/ios-screenshots.yml).
  kQSOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: kQSOUITests
    dependencies:
      - target: kQSO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ok1cdj.kqso.uitests
        GENERATE_INFOPLIST_FILE: YES
