name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly: the offline references (refs/) are rebuilt from the programs' lists.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The site = the web app + refs/ (offline references by locator field). refs/ stays
      # out of web/dist, which the APK and the iOS bundle are built from. A source that
      # fails stops the deploy, so the last good refs/ stays online.
      - run: |
          cp -r dist ../_site
          python3 scripts/refdata.py --out ../_site/refs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
