name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly: the offline references (refs/) are rebuilt from the programs' lists.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The web app reaches the ON4KST chat through the kQSO relay (relay/kst on the VPS);
      # the APK and the iOS app connect natively and are built without it.
      - run: npm run build
        env:
          VITE_KST_RELAY_URL: wss://kst.kqso.ok1cdj.com/kst
      # The site = the web app + refs/ (offline references by locator field). refs/ stays
      # out of web/dist, which the APK and the iOS bundle are built from. When a source
      # is down or changed its format, the references online now are carried over, so
      # the app still deploys; only when that fails too does the deploy stop.
      - run: |
          cp -r dist ../_site
          if ! python3 scripts/refdata.py --out ../_site/refs; then
            echo "::warning::References not rebuilt (a source failed); keeping the published ones"
            rm -rf ../_site/refs
            python3 scripts/refdata.py --mirror https://kqso.ok1cdj.com/refs/ --out ../_site/refs
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
