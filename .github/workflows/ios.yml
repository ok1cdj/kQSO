name: iOS

# The iOS shell (ios/) on a macOS runner — no Mac needed locally.
#  - Every push to the `ios` branch (and a manual run) builds for the Simulator without
#    signing: a compile check.
#  - A v* tag, or a manual run with "testflight" ticked, archives, signs with
#    cloud-managed certificates (App Store Connect API key) and uploads to TestFlight.
#
# Repository secrets for the upload (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID      - App Store Connect API key ID (role Admin)
#   ASC_ISSUER_ID   - issuer ID
#   ASC_KEY_P8      - `base64 -w0 AuthKey_XXXX.p8`
#   APPLE_TEAM_ID   - Apple Developer team ID
on:
  push:
    branches: ['ios']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # App Store Connect takes only builds from the iOS 26 SDK (Xcode 26) or later.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Generate the Xcode project
        run: |
          rm -rf ios/kQSO/web && cp -R web/dist ios/kQSO/web
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Version
        id: v
        run: echo "version=$(node -p "require('./web/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build for the Simulator (no signing)
        run: |
          xcodebuild -project ios/kQSO.xcodeproj -scheme kQSO -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION=${{ steps.v.outputs.version }} CODE_SIGNING_ALLOWED=NO build

      - name: Archive and upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v') || inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM" ]; then echo "::error::App Store Connect secrets are not set"; exit 1; fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/kQSO.xcodeproj -scheme kQSO -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/kQSO.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION=${{ steps.v.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} "${AUTH[@]}" archive
          sed "s/TEAM_ID/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/kQSO.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export "${AUTH[@]}"
