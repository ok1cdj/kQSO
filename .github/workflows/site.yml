name: Deploy the website (kqso.eu)

# The website is built from site/ (pages, layout, media) plus the manual's screenshots and
# the app's What's new, and pushed to the gh-pages branch of ok1cdj/kqso-site, whose
# GitHub Pages serve kqso.eu. A second repo, as one Pages site has one custom domain and
# this repo's is the app (kqso.ok1cdj.com). Needs the secret SITE_DEPLOY_KEY: the private
# half of a deploy key with write access on ok1cdj/kqso-site.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - web/src/core/whatsnew.ts
      - web/src/core/version.ts
      - web/public/kqso-icon.svg
      - web/public/kqso-apple-touch-icon-180.png
      - web/public/manual/img/**
      - web/package.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: ok1cdj/kqso-site
          publish_branch: gh-pages
          publish_dir: ./site/dist
          cname: kqso.eu
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
