<meta charset="utf-8">

<link rel="alternate" hreflang="cs" href="https://kqso.eu/cs/">

<!-- Czech for a Czech or Slovak browser, English otherwise; links below without JS. -->
<script>
  ;(function () {
    var l = (navigator.languages && navigator.languages[0]) || navigator.language || ''
    // Where the visitor came from, for the language page's statistics (site.js).
    try {
      if (document.referrer) sessionStorage.setItem('kqso-ref', document.referrer)
    } catch (e) {}
    location.replace(/^(cs|sk)\b/i.test(l) ? '/cs/' : '/en/')
  })()
</script>
</head>

<main class="wrap page-head">
  <p class="brand"><img src="/favicon.svg" alt="" width="40" height="40"><span>kQSO</span></p>

    <a class="btn btn-ink" href="/en/" hreflang="en">English</a>
    <a class="btn" href="/cs/" hreflang="cs" lang="cs">Česky</a>
  </p>
</main>
</body>
</html>
